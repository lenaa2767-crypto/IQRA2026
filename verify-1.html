<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>التحقق من الشهادة — أكاديمية اقرأ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#C9A227;--goldD:#A8841B;--ink:#2D3A4A;--ink2:#5A6A7A}
body{font-family:Cairo,Tajawal,sans-serif;margin:0;min-height:100vh;
 background:linear-gradient(180deg,#FDFAF3,#F0E8D2);color:var(--ink);
 display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#FFFEF9;max-width:420px;width:100%;border-radius:22px;
 box-shadow:0 22px 60px rgba(60,45,10,.18);padding:34px 26px;text-align:center;
 border-top:8px solid var(--gold);border-bottom:8px solid var(--gold)}
.brand{font-size:.8rem;font-weight:700;color:var(--goldD);letter-spacing:.5px}
h1{font-family:Amiri,serif;font-size:1.6rem;margin:8px 0 2px}
.badge{display:inline-block;background:#EAF7EA;color:#2E7D32;font-weight:900;
 border-radius:30px;padding:8px 20px;margin:14px 0;font-size:.95rem}
.badge.err{background:#FBEAEA;color:#B03A3A}
.name{font-family:Amiri,serif;font-size:2.4rem;font-weight:700;margin:6px 0 2px}
.world{color:var(--goldD);font-weight:900;font-size:1.15rem;margin-bottom:14px}
.stats{display:flex;justify-content:center;gap:10px;margin:16px 0}
.st{background:#FBF6E8;border:1.5px solid #EADFC2;border-radius:14px;padding:10px 14px;min-width:84px}
.st .v{font-size:1.4rem;font-weight:900;color:var(--ink)}
.st .l{font-size:.72rem;color:var(--ink2);font-weight:700}
.meta{font-size:.78rem;color:#A9A08B;margin-top:16px;line-height:1.8}
.spin{font-size:1rem;color:var(--ink2);padding:30px 0}
.foot{margin-top:18px;font-size:.75rem;color:var(--ink2)}
.foot a{color:var(--goldD);font-weight:900;text-decoration:none}
</style></head><body>
<div class="card" id="card">
 <div class="brand">أكاديمية اقرأ · IQRA ACADEMY</div>
 <h1>التحقّق من الشهادة</h1>
 <div class="spin" id="body">جارٍ التحقّق من سجلات الأكاديمية…</div>
</div>
<script>
var FB_PROJECT='iqraa-app-7fbe5';
var FB_API='AIzaSyAuht0nBKwwIjmLcKRa4loK_KzODB7UWpQ';
var BASE='https://firestore.googleapis.com/v1/projects/'+FB_PROJECT+'/databases/(default)/documents';
var WORLDS=[
 {nm:'حديقة البدايات',lets:['alef','lam','meem','ba','noon']},
 {nm:'جزيرة الأقواس',lets:['ta','tha','ya','kaf','fa']},
 {nm:'شاطئ الأسنان',lets:['seen','sheen','sad','dad']},
 {nm:'وادي المنعطفات',lets:['ra','zay','dal','thal','waw']},
 {nm:'مدينة الحلقات',lets:['jeem','ha','kha','haa','tam']},
 {nm:'قلعة الحروف الذهبية',lets:['ain','ghain','qaf','taa','thaa']},
 {nm:'سماء النجوم',lets:['hamza','alefmaqsura']},
 {nm:'مملكة الهمزات',lets:['alefhamzaabove','alefhamzabelow','wawhamza','yahamza']}
];
var ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة'];
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fail(msg){
 document.getElementById('body').innerHTML=
  '<div class="badge err">⚠️ '+msg+'</div>'
  +'<div class="foot">إن كنت تعتقد أن هذا خطأ، تواصل مع <a href="https://lenaa2767-crypto.github.io/IQRA2026/index.html">أكاديمية اقرأ</a></div>';
}
var ps=new URLSearchParams(location.search);
var code=(ps.get('c')||'').trim(),wIx=parseInt(ps.get('w')||'0',10);
if(!code||isNaN(wIx)||wIx<0||wIx>7){fail('رابط التحقق غير مكتمل')}
else{
 fetch(BASE+'/codes/'+encodeURIComponent(code)+'?key='+FB_API)
 .then(function(r){return r.json()})
 .then(function(cd){
  if(!cd.fields)throw new Error('nocode');
  var childName=cd.fields.childName&&cd.fields.childName.stringValue||'';
  var seq=cd.fields.seq?parseInt(cd.fields.seq.integerValue,10):0;
  /* جلب التقدم الحقيقي بالكود */
  return fetch(BASE+':runQuery?key='+FB_API,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({structuredQuery:{
    from:[{collectionId:'progress'}],
    where:{fieldFilter:{field:{fieldPath:'code'},op:'EQUAL',value:{stringValue:code}}},
    limit:5
   }})
  }).then(function(r){return r.json()})
  .then(function(res){
   /* لو أكثر من وثيقة (اسم بحرف مختلف)، خذ صاحبة التقدم الأكبر */
   var best=null,bestDc=-1;
   (res||[]).forEach(function(row){
    if(!row.document)return;
    var f=row.document.fields||{};
    var dc=f.doneCount?parseInt(f.doneCount.integerValue,10):0;
    if(dc>bestDc){bestDc=dc;best=f}
   });
   render(childName,seq,best);
  });
 })
 .catch(function(){fail('لم يُعثر على هذه الشهادة في سجلات الأكاديمية')});
}
function render(childName,seq,f){
 var w=WORLDS[wIx];
 var stars=0,masteredInWorld=0,doneCount=0;
 if(f){
  stars=f.stars?parseInt(f.stars.integerValue,10):0;
  doneCount=f.doneCount?parseInt(f.doneCount.integerValue,10):0;
  var ls=f.letterState&&f.letterState.mapValue&&f.letterState.mapValue.fields||{};
  w.lets.forEach(function(id){
   var st=ls[id]&&ls[id].mapValue&&ls[id].mapValue.fields;
   var m=st&&st.masteryState&&st.masteryState.stringValue||'';
   if(m.indexOf('mastered')===0)masteredInWorld++;
  });
 }
 var certN=seq>0?(2600+seq*8+wIx):null;
 var complete=masteredInWorld>=w.lets.length;
 document.getElementById('body').innerHTML=
  '<div class="badge">'+(complete?'✅ شهادة موثّقة من سجلات الأكاديمية':'✅ سجل طالب موثّق — المرحلة قيد الإتمام')+'</div>'
  +'<div class="name">'+esc(childName||'—')+'</div>'
  +'<div class="world">المغامرة '+ORD[wIx]+' · «'+w.nm+'»</div>'
  +'<div class="stats">'
  +'<div class="st"><div class="v">'+masteredInWorld+'/'+w.lets.length+'</div><div class="l">حروف المرحلة المتقنة</div></div>'
  +'<div class="st"><div class="v">'+doneCount+'</div><div class="l">إجمالي الحروف</div></div>'
  +'<div class="st"><div class="v">'+stars+'</div><div class="l">النجوم ⭐</div></div>'
  +'</div>'
  +'<div class="meta">'
  +(certN?('رقم الشهادة: IQRA-'+(new Date()).getFullYear()+'-'+certN+'<br/>'):'')
  +'هذه البيانات مقروءة مباشرةً من سجلات التعلّم الحيّة لأكاديمية اقرأ لحظة فتح هذه الصفحة.'
  +'</div>'
  +'<div class="foot">اقرأ ✨ تعلّم باللعب · <a href="https://lenaa2767-crypto.github.io/IQRA2026/index.html">iqra academy</a></div>';
}
</script></body></html>
